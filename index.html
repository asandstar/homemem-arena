<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>回声屋 · 记忆宅邸 | HomeMem Arena</title>
    <script>
      // GitHub Pages SPA 路由恢复：从 404 重定向回来时恢复原始路径
      // 约定：public/404.html 写入 sessionStorage['spa-redirect'] 的语义固定为：
      //   「basename 之后的 site-root 相对路径 + search + hash」，
      //   例如 '/tasks'、'/play/task-clean-table?foo=1#anchor'。
      // 注意：history.replaceState 接收的字符串如果以 '/' 开头 = 「site root 相对路径」，
      //       不会自动拼接 basename；这里手动用 base（即 vite.config.ts 的 base）拼，
      //       这样最后 location.pathname = basename + storedPath。
      (function () {
        var base = '/homemem-arena/';
        var stored = null;
        try {
          stored = window.sessionStorage.getItem('spa-redirect');
        } catch (e) {
          stored = null;
        }
        if (!stored) return;
        try { window.sessionStorage.removeItem('spa-redirect'); } catch (e) { /* ignore */ }
        if (stored === '/' || stored === '') return;
        // normalized = stored 肯定带前导 '/'（public/404.html 里已规范化）
        var normalized = stored.charAt(0) === '/' ? stored : '/' + stored;
        // targetPathname = '/homemem-arena' + '/tasks'
        var baseNoSlash = base.charAt(base.length - 1) === '/' ? base.slice(0, -1) : base;
        var targetPathname = baseNoSlash === '' ? normalized : (baseNoSlash + normalized);
        // 用完整 URL (origin + targetPathname + stored里的 search/hash) 做 replaceState，
        // 确保各种浏览器（safari history.replaceState 相对路径解析差异）下最终路径完全一致。
        var loc = window.location;
        var origin = loc.origin || (loc.protocol + '//' + loc.host);
        // stored 除 pathname 之外可能携带的 search/hash 部分：normalized 是 stored 按前导 '/' 拼好的，
        // 直接用 stored（它本来就带 search/hash，如果有的话）更稳。
        var rest = stored.charAt(0) === '/' ? stored : '/' + stored;
        var finalTarget = origin + baseNoSlash + rest;
        try {
          window.history.replaceState(window.history.state, '', finalTarget);
        } catch (e) {
          // 兜底：如果浏览器不允许 replaceState（隐私模式/旧引擎），做一次 location.replace。
          try { window.location.replace(finalTarget); } catch (_) { /* ignore */ }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
