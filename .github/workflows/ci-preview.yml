name: CI Preview (Build Verify Only)

on:
  push:
    # 所有非 main 的分支 push 都跑一次完整 build 验证（含 lint/test/qa/build）但不部署
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # feat 分支同名并发，保证只跑最新一次，cancel 历史
  group: ci-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint (oxlint)
        run: npm run lint

      - name: Run tests (vitest)
        run: npm test

      - name: Run QA (三关模拟 + 资源校验)
        run: npm run qa

      - name: Build (Vite production)
        run: npm run build

      - name: Upload dist artifact for pre-deploy preview
        uses: actions/upload-artifact@v4
        with:
          name: ci-preview-dist-${{ github.sha }}
          path: dist/
          retention-days: 3
